groups:
  - name: naposo-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for 2 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response latency"
          description: "p95 latency is above 2 seconds"

      - alert: ServiceDown
        expr: up{job="naposo"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NaPoso service is down"
          description: "Health check failing for more than 1 minute"
