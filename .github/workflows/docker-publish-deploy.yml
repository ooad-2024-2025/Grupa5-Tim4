name: Docker Publish & Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  publish-and-deploy:
    name: Build, push Docker image & deploy to Render
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact from workflow_run trigger (commit SHA context)
        run: |
          echo "Using head_sha=${{ github.event.workflow_run.head_sha }} from ${{ github.event.workflow_run.head_branch }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image to Docker Hub (latest + SHA tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/naposo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/naposo:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy via webhook
        run: |
          echo "Triggering Render deploy hook..."
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL secret is not set. Skipping deploy trigger."
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /tmp/render-response.txt -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render hook responded with HTTP $HTTP_CODE"
          if [ $HTTP_CODE -lt 200 ] || [ $HTTP_CODE -ge 300 ]; then
            echo "Render hook failed."
            cat /tmp/render-response.txt
            exit 1
          fi
          echo "Deploy triggered successfully."
          cat /tmp/render-response.txt
